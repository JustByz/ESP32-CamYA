; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

upload_speed = 921600
monitor_speed = 115200

; ФС — LittleFS (без внешних либ, ты всё верно сделал)
board_build.filesystem = littlefs

; кастомная разметка c двумя OTA разделами (тот partitions.csv, что мы собрали)
board_build.partitions = partitions.csv

; Либы
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.3
  ; ↓ Камера обычно идёт в составе core, но если используешь либу — пиновать версию:
  espressif/esp32-camera @ ^2.0.0

; Оптимизации и стабильность ESP32-CAM
build_flags =
  -DCORE_DEBUG_LEVEL=0           ; меньше логов = меньше накладных расходов
  -DBOARD_HAS_PSRAM              ; у ESP32-CAM есть PSRAM — помогает камере/стриму
  -mfix-esp32-psram-cache-issue  ; фикс кэша PSRAM
  -Os                            ; размер: по умолчанию и так Os, но явно не повредит
  -ffunction-sections -fdata-sections
  -Wl,--gc-sections              ; линкер выкинет неиспользуемое
  -DHTTPD_MAX_REQ_HDR_LEN=1024   ; чуть увеличим заголовки (иногда полезно для клиентов)

; опционально — чтобы monitor показывал время и цвета:
; monitor_filters = time, colorize